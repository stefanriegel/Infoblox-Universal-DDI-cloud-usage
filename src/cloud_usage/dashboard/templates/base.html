<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDDI Cloud Usage Estimator</title>
    <link rel="stylesheet" href="{{ url_for('static', path='pico.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
    <header class="container">
        <nav>
            <ul><li><strong>UDDI Cloud Usage Estimator</strong></li></ul>
        </nav>
    </header>
    <main class="container" id="main-content">
        {% block content %}
        <div id="tab-container"
             hx-get="/tab/progress" hx-trigger="load" hx-target="#tab-container">
            <p>Loading...</p>
        </div>
        {% endblock %}
    </main>
    <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='sse.js') }}"></script>
</body>
</html>
