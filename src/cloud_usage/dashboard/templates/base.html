<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDDI Estimator</title>
    <link rel="stylesheet" href="{{ url_for('static', path='design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav>
                <ul><li><strong>UDDI Estimator</strong></li></ul>
            </nav>
        </div>
    </header>
    {% if calculator_name %}
    <nav class="breadcrumb-nav" aria-label="breadcrumb">
        <div class="container">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item breadcrumb-current" aria-current="page">{{ calculator_name }}</li>
            </ol>
        </div>
    </nav>
    {% endif %}
    <main class="container" id="main-content">
        {% block content %}
        <div id="tab-container"
             hx-get="/tab/{{ active_tab if active_tab in ('progress', 'nios', 'ad') else 'progress' }}" hx-trigger="load" hx-target="#tab-container">
            <p>Loading...</p>
        </div>
        {% endblock %}
    </main>
    <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='sse.js') }}"></script>
    <script>
      // Global HTMX v2 error handler — surfaces silent 4xx/5xx failures to the console.
      // Element-level hx-on:htmx:responseError handlers take precedence for specific forms.
      document.body.addEventListener('htmx:responseError', function(evt) {
        console.error('[HTMX] Request failed:', evt.detail.requestConfig.path,
                      'Status:', evt.detail.xhr.status, evt.detail.xhr.statusText);
      });
    </script>
</body>
</html>
